<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA LIGURIA S.A. - Iniciar Sesión</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos del Login -->
    <link rel="stylesheet" href="assets/css/login.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-card">
        <!-- Encabezado Oscuro -->
        <div class="login-header">
            <div class="logo-container">
                <img src="img/logo.png" alt="La Liguria Logo" class="logo-img">
            </div>
            <h2>LA LIGURIA S.A.</h2>
            <p>Gestión e Inventario Multi-Sede</p>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="login-body">
            <!-- Indicador de Estado / Alerta -->
            <div id="status-badge" class="status-badge success">
                <i class="fa-solid fa-circle-check"></i> Conexión exitosa con Supabase
            </div>

            <form id="form-login">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="Ingrese su correo electrónico" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" id="btn-login" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
                </button>
            </form>

            <footer class="login-footer">
                <p>© 2026 LA LIGURIA S.A. Todos los derechos reservados.</p>
            </footer>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
