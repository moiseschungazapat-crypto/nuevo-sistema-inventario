<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA LIGURIA S.A. - Iniciar Sesión</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos del Login -->
    <link rel="stylesheet" href="assets/css/login.css">
    <meta name="referrer" content="no-referrer">
</head>
<body>
    <div class="login-card">
        <!-- Encabezado Oscuro -->
        <div class="login-header">
            <div class="logo-container">
                <img src="img/logo.png" alt="La Liguria Logo" class="logo-img">
            </div>
            <h2>LA LIGURIA S.A.</h2>
            <p>Gestión e Inventario Multi-Sede</p>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="login-body">
            <!-- Indicador de Estado / Alerta -->
            <div class="login-steps" aria-label="Progreso del acceso"><span class="login-step active" id="step-credentials"><i class="fa-solid fa-1"></i><span>Credenciales</span></span><span class="login-step" id="step-otp"><i class="fa-solid fa-2"></i><span>Código OTP</span></span></div>
            <div id="status-badge" class="status-badge neutral" role="status" aria-live="polite">
                Ingresa con tu cuenta de la empresa.
            </div>

            <form id="form-login">
                <div id="credentials-step">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" autocomplete="username" placeholder="Ingrese su correo electrónico" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
                    </div>
                <button type="button" id="btn-recover" class="btn-link">Olvidé mi contraseña</button>
                </div>
                <div id="otp-step" hidden>
                    <p id="otp-help" class="otp-help">Enviamos un código de 6 dígitos a tu correo. Es válido por unos minutos.</p>
                    <div class="form-group">
                        <label for="otp">Código de verificación</label>
                        <input type="text" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" aria-describedby="otp-help">
                    </div>
                    <button type="button" id="btn-back" class="btn-link">Volver y cambiar correo</button>
                    <button type="button" id="btn-resend" class="btn-link">Reenviar código</button>
                </div>

                <button type="submit" id="btn-login" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
                </button>
            </form>
            <noscript>Necesitas activar JavaScript para iniciar sesión.</noscript>

            <footer class="login-footer">
                <p>© 2026 LA LIGURIA S.A. Todos los derechos reservados.</p>
            </footer>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
